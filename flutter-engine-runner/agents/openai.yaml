interface:
  display_name: "Flutter 工程执行"
  short_description: "按用户主题、项目名称及五档性能与功能目标水平选择执行完整 Flutter 工程流程"
  default_prompt: "使用 $flutter-engine-runner 开始执行；合并收集缺少的项目名称、创意主题、性能与功能目标水平；性能完整列出 1 极低、2 低、3 中（推荐默认）、4 高、5 极高供直接选择，功能标准自动制定，不要求手写；性能不在乎/无限制映射极高档；每页分别生成详细图与独立执行文档，展示全部图及执行摘要后等待一次整体确认；工程直接创建在指定目录，未指定时使用当前 Codex 工作目录。"
