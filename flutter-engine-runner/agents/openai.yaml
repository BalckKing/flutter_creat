interface:
  display_name: "Flutter 工程执行"
  short_description: "按用户主题、项目名称、五档性能与功能目标水平及 Git 仓库地址执行完整流程"
  default_prompt: "使用 $flutter-engine-runner 开始执行；合并收集缺少的项目名称、创意主题、性能与功能目标水平、Git 仓库地址，仓库地址由用户随主题一并给出；性能完整列出 1 极低、2 低、3 中（推荐默认）、4 高、5 极高供直接选择，功能标准自动制定，不要求手写；性能不在乎/无限制映射极高档；每页分别生成详细图与独立执行文档，展示全部图及执行摘要后等待一次整体确认；工程直接创建在指定目录，未指定时使用当前 Codex 工作目录。 游戏先做专用引擎必要性决策：持续世界、实时物理/碰撞、复杂3D、高频实体或编辑器导出管线使用一个精确版本的真实引擎；回合制、卡牌、问答、轻量棋盘和有限状态解谜可用 Flutter 原生实现。将 implementation_mode、engine_required、decision_reason 写入 .work/game-engine.json；引擎路线完成引擎垂直切片，Flutter 原生路线完成 Flutter 规则垂直切片并使用动画/效果目录与六部分效果提示词公式，运行 `python3 <skill-root>/scripts/validate_game_project.py --project-root <target-project-root> --json`，并在原生/build 变更后和最终验收前重跑。两条路线都必须实际输入、规则、结果、反馈、重开和当前 iPhone 证据；禁止空场景、彩色方块、静态截图或隐藏路由冒充玩法；非游戏项目也必须按主题选择真实地图 SDK/瓦片、图表、媒体、3D、时间线工具，记录 capability、real_tool_or_sdk、version、license/source、actual_consumer、fallback、runtime_evidence、formula_record；禁止线条地图、色块地图、静态地图截图、假网格，组件目录不是全量安装清单。每个项目独立设计架构、导航和视觉样式，按工作流验收。 项目自有文件夹和文件名禁止Codex/AI相关词，开发记录统一.work/并执行命名检查；非游戏默认按主题工作台交付，至少 12 页面、8 模块、120 条有效内容和 12 条完整任务，覆盖发现、创建、编辑、分析、历史/回访、设置、帮助与结果反馈；项目 UI 自主创作，以完整成品的美观与精修证据验收，不套固定外观；每页保留真实半透明主题图片点缀，与背景动画同时呈现，按当前构建逐页检查；生图网站/工具不要求统一，按题材选择，以精致美观和主题质量验收。 按主题能力矩阵完成适用 iOS 能力、拒绝降级和运行验证后，全部验收、修复复验及五张最终截图通过后，运行 scripts/prepare_git_handoff.py 在真实 Flutter 工程根目录初始化自己的 .git、关联用户 Git 地址、创建并切换 feat/1.0.0，检查 user.name/user.email 并写入 .work/git-handoff.md；不暂存、不提交、不推送代码，等待用户自行提交。"


# Native Navigator hard gate: never use GetX or external router packages; use
# MaterialApp/CupertinoApp/WidgetsApp and Navigator routes, then run
# validate_flutter_navigation.py before acceptance.

Settings 必须使用主题化品牌头部、分组图标、摘要状态和真实选项值；不能生成单调的连续文字设置页。
