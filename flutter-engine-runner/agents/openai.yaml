interface:
  display_name: "Flutter 工程执行"
  short_description: "按用户主题、项目名称、五档性能与功能目标水平及 Git 仓库地址执行完整流程"
  default_prompt: "使用 $flutter-engine-runner 开始执行；合并收集缺少的项目名称、创意主题、性能与功能目标水平、Git 仓库地址，仓库地址由用户随主题一并给出；性能完整列出 1 极低、2 低、3 中（推荐默认）、4 高、5 极高供直接选择，功能标准自动制定，不要求手写；性能不在乎/无限制映射极高档；每页分别生成详细图与独立执行文档，展示全部图及执行摘要后等待一次整体确认；工程直接创建在指定目录，未指定时使用当前 Codex 工作目录。 游戏按主题选用专用引擎并核验/搭建环境、实测玩法，非游戏多用贴题本地动态图；每个项目独立设计架构、导航和视觉样式，按工作流验收。 项目自有文件夹和文件名禁止Codex/AI相关词，开发记录统一.work/并执行命名检查；项目 UI 自主创作，以完整成品的美观与精修证据验收，不套固定外观；每页保留真实半透明主题图片点缀，与背景动画同时呈现，按当前构建逐页检查；生图网站/工具不要求统一，按题材选择，以精致美观和主题质量验收。 全部验收、修复复验及五张最终截图通过后，最后关联用户提供的 Git 仓库地址，创建并切换 feat/1.0.0；不暂存、不提交、不推送代码，等待用户自行提交。"


# Native Navigator hard gate: never use GetX or external router packages; use
# MaterialApp/CupertinoApp/WidgetsApp and Navigator routes, then run
# validate_flutter_navigation.py before acceptance.
